{% extends 'jobs/base.html' %}
{% load static %}

{% block title %}404 - Page Not Found | CareerConnect{% endblock %}

{% block content %}
<div class="py-20 lg:py-32 text-center">
  <div class="max-w-md mx-auto px-4">
    <div class="w-20 h-20 rounded-3xl bg-navy-50 text-navy-800 border border-slate-200 flex items-center justify-center font-extrabold text-3xl mx-auto mb-6 shadow-sm">
      404
    </div>
    <h1 class="text-3xl font-extrabold text-navy-900 mb-2">Page Not Found</h1>
    <p class="text-sm text-slate-500 mb-8 leading-relaxed">
      The page or job opening you are looking for may have been moved, expired, or does not exist.
    </p>
    <div class="flex items-center justify-center gap-3">
      <a href="{% url 'home' %}" class="btn-primary text-xs py-2.5 px-5">
        Back to Home
      </a>
      <a href="{% url 'all_jobs' %}" class="btn-outline text-xs py-2.5 px-5">
        Browse All Jobs
      </a>
    </div>
  </div>
</div>
{% endblock %}
